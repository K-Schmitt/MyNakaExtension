<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyNakaExtension</title>
  </head>
  <body>
    <main>
      <h1>MyNakaExtension</h1>
      <div id="status" aria-live="polite">
        <p id="headline" tabindex="-1">Chargement…</p>
        <ul id="lines"></ul>
        <section id="preview-section" hidden>
          <h2>Écritures prévues</h2>
          <ul id="preview"></ul>
        </section>
      </div>
      <p>
        <button type="button" id="resync" disabled>Resynchroniser</button>
        <button type="button" id="switch" disabled hidden></button>
      </p>
      <section id="settings" hidden>
        <h2>Réglages</h2>
        <p>
          <label for="film-threshold">Seuil pour les films</label>
          <select id="film-threshold"></select>
        </p>
        <p>
          <label for="episode-threshold">Seuil pour les épisodes</label>
          <select id="episode-threshold"></select>
        </p>
        <fieldset>
          <legend>Bloc sur la pause</legend>
          <p>
            <input type="radio" name="pause" id="pause-any" />
            <label for="pause-any">À tout moment</label>
          </p>
          <p>
            <input type="radio" name="pause" id="pause-from" />
            <label for="pause-from" id="pause-from-before">À partir de</label>
            <input type="text" inputmode="numeric" size="3" id="pause-text" aria-labelledby="pause-from-before" aria-describedby="pause-error" />&#8239;%
          </p>
          <p id="pause-error" role="alert"></p>
        </fieldset>
        <p><button type="button" id="save-settings" disabled>Enregistrer les réglages</button></p>
        <p id="settings-note" role="status"></p>
      </section>
      <details id="handled" hidden>
        <summary id="handled-heading">Titres traités</summary>
        <ul id="handled-list"></ul>
      </details>
    </main>
    <script src="status.js"></script>
  </body>
</html>
