name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the tag against the manifest and package versions
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - run: npm run check
      - name: Zip dist with manifest.json at the root
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist && zip -r "../MyNakaExtension-${VERSION}.zip" .)
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" "MyNakaExtension-${VERSION}.zip"
